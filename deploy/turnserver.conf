# /etc/turnserver.conf  (coturn)
listening-port=3478

# AWS/Oracle jaise cloud par (jahan server ka public IP seedha network card par nahi hota) ye zaroori hai:
#   external-ip=PUBLIC_IP/PRIVATE_IP
# DigitalOcean/Vultr/Hetzner par aam taur par zaroorat nahi.
# external-ip=

realm=YOUR_DOMAIN
fingerprint

# Time-limited credentials: backend ke TURN_SECRET wala hi secret
use-auth-secret
static-auth-secret=PUT_THE_SAME_SECRET_AS_BACKEND_TURN_SECRET

# Relay ke liye ports ki chhoti range (firewall mein bhi yahi kholni hai)
min-port=50000
max-port=50100

# Server ke andar ke network ki taraf relay mana (warna koi TURN ke zariye tumhare server ke
# private services tak pahunchne ki koshish kar sakta hai)
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Hamesha ke liye bandwidth na kha sake
total-quota=100
stale-nonce=600

no-cli
no-tls
no-dtls