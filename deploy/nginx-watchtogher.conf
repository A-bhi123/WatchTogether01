# /etc/nginx/sites-available/watchtogether
# YOUR_DOMAIN ko asli domain se badalna hai (Part B ke step mein sed se). HTTPS ka hissa certbot khud jodta hai.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/watchtogether;   # frontend ka build yahan rakha jata hai
    index index.html;

    # Movie upload: backend ki MAX_VIDEO_SIZE_MB (2048) se thoda zyada. (Nginx ka default sirf 1 MB hai!)
    client_max_body_size 2100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;   # badi upload seedha Node tak jaye, Nginx pehle poori disk par na utare
        proxy_buffering off;           # movie ka stream turant chalu ho
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # --- Socket.IO (WebSocket) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- Build ki files (naam mein hash hota hai, isliye lamba cache safe hai) ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Frontend (SPA): file na mile (jaise /room/ABC123) to index.html ---
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache";   # index.html hamesha taza, usme naye build ki files ka naam hota hai
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Camera, mic, screen share sirf isi site ko. (Ye line galat hui to features band ho jate hain)
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        # Pehle sirf "Report-Only": kuch tootega nahi, browser console mein violations dikhenge.
        # Console saaf rahe to "-Report-Only" hata kar asli CSP bana do.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://YOUR_DOMAIN; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}